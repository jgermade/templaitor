# Optional: Postgres instead of SQLite (needed to run several templaitor instances). Usage:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.postgres.yml --env-file deploy/.env up -d --build
# With several instances also use TEMPLAITOR_STORAGE=db (templates in the database, not on one disk).
services:
  templaitor:
    environment:
      TEMPLAITOR_DATABASE_URL: postgres://templaitor:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/templaitor
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: templaitor
      POSTGRES_DB: templaitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - templaitor-postgres:/var/lib/postgresql/data   # back this up (pg_dump)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U templaitor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  templaitor-postgres:
