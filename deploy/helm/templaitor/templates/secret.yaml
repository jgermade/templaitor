{{- if not .Values.secret.existingSecret }}
{{- $name := include "templaitor.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $secret := .Values.secret.value }}
{{- if and (not $secret) $existing }}
{{- $secret = index $existing.data "TEMPLAITOR_SECRET" | b64dec }}
{{- end }}
{{- if not $secret }}
{{- $secret = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "templaitor.labels" . | nindent 4 }}
  {{- if .Values.secret.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  TEMPLAITOR_SECRET: {{ $secret | b64enc | quote }}
  {{- with .Values.config.database.url }}
  TEMPLAITOR_DATABASE_URL: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.config.smtp.password }}
  TEMPLAITOR_SMTP_PASS: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
