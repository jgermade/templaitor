# templaitor hosted service — copy to templaitor.server.yml (or use environment variables, see deploy/.env.example)
baseUrl: https://templaitor.example.com
port: 3000
dataDir: ./data
# secret: …              # prefer TEMPLAITOR_SECRET in the environment
signup: invite           # open · invite
trustProxy: true
storage:
  driver: fs             # fs (folder per org) · db (files in the database)
  dir: orgs              # fs: one project per org under dataDir/orgs/<slug>
  projects:              # fs: orgs mapped to existing folders (e.g. a git checkout)
    # acme: /srv/acme/emails
smtp:                    # sign-in codes and invitations
  host: smtp.example.com
  port: 587
  user: templaitor
  from: "templaitor <no-reply@example.com>"
send:
  maxAttempts: 6
  rateLimitPerMinute: 120
