# Manual release: bumps the version, runs build.yml, creates the GitHub release with the build attached
# (npm package, editor zip, binary bundles, Helm chart), publishes the Docker image
# (ghcr.io/<owner>/templaitor) and the Helm chart (oci://ghcr.io/<owner>/charts/templaitor), and deploys
# the landing page with setup.sh to GitHub Pages (pages.yml).
#
# Requirements: Settings → Pages → Source: "GitHub Actions"; the workflow must be allowed to push
# the version bump commit and tag to the branch it runs on.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute next version
        id: next
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version > /dev/null
          version="$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            echo "::error::Tag v${version} already exists"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Next version: v${version}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Commit version bump and tag
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}" "v${VERSION}"

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" artifacts/* \
            --title "v${VERSION}" \
            --generate-notes \
            --verify-tag

  docker:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: artifacts

      - uses: azure/setup-helm@v4

      - name: Push the chart to ghcr.io
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "artifacts/templaitor-chart-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

  pages:
    needs: [version, release]
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      version: ${{ needs.version.outputs.version }}
