# Builds the site (site/: landing page and API reference at /api/, plus the in-browser editor demo at /demo/)
# and deploys it to GitHub Pages.
# Manual, or called by release.yml. The upload and the deployment run in separate jobs (GitHub's
# recommended layout): deploy-pages looks the artifact up through the API, and an artifact uploaded in
# the same job may not be listed yet.
#
# Requirement: Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version shown in the site footer (defaults to package.json)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stamp version
        if: ${{ inputs.version }}
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      # the demo (/demo/) bundles the editor and the engine for the browser: it needs the dependencies
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # the demo serves PDFs pre-generated here (the browser cannot render them): WeasyPrint makes them
      # PDF/UA-1 and veraPDF validates them
      - name: Install PDF tooling (WeasyPrint + veraPDF)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          pipx install weasyprint
          docker pull -q verapdf/cli:latest

      - name: Build site
        run: npm run build:demo -- --strict --engine weasyprint && node scripts/build-site.mjs --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
