# Installs dependencies, runs the tests and builds the editor, the npm package and the landing site.
# Also reusable from other workflows (release.yml) with an optional `version` to stamp the build.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to stamp into package.json before building (e.g. 1.2.3)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # the hosted-service tests also run against Postgres (TEMPLAITOR_TEST_POSTGRES_URL)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stamp version
        if: ${{ inputs.version }}
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      # Accessibility is a hard requirement: with WeasyPrint and veraPDF available, the test suite
      # renders the demo PDF and validates it against PDF/UA-1.
      - name: Install PDF tooling (WeasyPrint + veraPDF)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          pipx install weasyprint
          docker pull -q verapdf/cli:latest

      - name: Test
        run: npm test
        env:
          TEMPLAITOR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres

      - name: Build editor
        run: npm run build

      - name: Build site
        run: npm run build:site

      - name: Package
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          (cd dist && zip -q -r "../artifacts/templaitor-editor-${version}.zip" editor)
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: artifacts/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/site/
          include-hidden-files: true
          if-no-files-found: error
