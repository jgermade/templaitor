# Installs dependencies, runs the tests and builds the editor, the npm package, the binary bundles, the Helm
# chart and the landing site; also builds the Docker image and smoke-tests it.
# Also reusable from other workflows (release.yml) with an optional `version` to stamp the build.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to stamp into package.json before building (e.g. 1.2.3)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # the hosted-service tests also run against Postgres (TEMPLAITOR_TEST_POSTGRES_URL)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stamp version
        if: ${{ inputs.version }}
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      # Accessibility is a hard requirement: with WeasyPrint and veraPDF available, the test suite
      # renders the demo PDF and validates it against PDF/UA-1.
      - name: Install PDF tooling (WeasyPrint + veraPDF)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          pipx install weasyprint
          docker pull -q verapdf/cli:latest

      - name: Test
        run: npm test
        env:
          TEMPLAITOR_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres

      - name: Build editor
        run: npm run build

      # landing page + API reference + the editor demo that runs the engine in the browser
      - name: Build site
        run: npm run build:demo && node scripts/build-site.mjs --strict

      - name: Package
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          (cd dist && zip -q -r "../artifacts/templaitor-editor-${version}.zip" editor)

      # Self-contained bundles (app + production deps + official Node.js) for linux/darwin × x64/arm64
      - name: Build binaries
        run: node scripts/build-binary.mjs

      - name: Smoke-test the linux-x64 binary
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf artifacts/templaitor-linux-x64.tar.gz -C "$RUNNER_TEMP/bin"
          tpl="$RUNNER_TEMP/bin/templaitor/bin/templaitor"
          test "$("$tpl" version)" = "$(node -p "require('./package.json').version")"
          cp -r examples/demo "$RUNNER_TEMP/demo" && "$tpl" compile --cwd "$RUNNER_TEMP/demo" --strict
          TEMPLAITOR_SECRET=ci-only-secret-0123456789abcdef0123456789 TEMPLAITOR_DATA_DIR="$RUNNER_TEMP/data" PORT=3999 "$tpl" serve & pid=$!
          for _ in $(seq 30); do curl -fs http://127.0.0.1:3999/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:3999/healthz
          kill "$pid"

      # same Helm major as chart.yml (Helm 4 cannot push to ghcr.io)
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Helm chart (lint, render, package)
        run: |
          version="$(node -p "require('./package.json').version")"
          chart=deploy/helm/templaitor
          helm lint "$chart" --strict
          helm template t "$chart" > /dev/null
          helm template t "$chart" --set ingress.enabled=true --set 'ingress.tls[0].secretName=tls' \
            --set 'ingress.tls[0].hosts[0]=templaitor.example.com' --set config.smtp.host=smtp.example.com > /dev/null
          helm template t "$chart" --set replicaCount=3 --set config.database.driver=postgres \
            --set config.database.url=postgres://u:p@db/templaitor --set config.storage=db > /dev/null
          if helm template t "$chart" --set replicaCount=2 > /dev/null 2>&1; then
            echo "::error::replicaCount=2 with SQLite must be rejected"; exit 1
          fi
          # npm pack already writes templaitor-<version>.tgz: the chart gets its own name
          helm package "$chart" --version "$version" --app-version "$version" -d "$RUNNER_TEMP/chart"
          mv "$RUNNER_TEMP/chart/templaitor-${version}.tgz" "artifacts/templaitor-chart-${version}.tgz"
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: artifacts/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/site/
          include-hidden-files: true
          if-no-files-found: error

  # Builds the hosted-service image (no push: release.yml publishes it) and checks that it serves.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # the image has no .git: ship the templates' version history as a snapshot (/v1/send { version })
      - name: Export template versions
        run: npm ci --ignore-scripts --no-audit --no-fund && node bin/templaitor.js versions export

      - name: Stamp version
        if: ${{ inputs.version }}
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: templaitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name tpl -p 3000:3000 -e TEMPLAITOR_SECRET=ci-only-secret-0123456789abcdef0123456789 templaitor:ci
          for _ in $(seq 30); do curl -fs http://127.0.0.1:3000/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:3000/healthz || { docker logs tpl; exit 1; }
          docker exec tpl node bin/templaitor.js version
          docker exec tpl sh -c 'cd /tmp && cp -r /app/examples/demo d && node /app/bin/templaitor.js pdf documents/invoice --cwd d -o /tmp/i.pdf'
          docker rm -f tpl
          # project mode: the repository's templates, read-only, with an API key from the environment
          docker run -d --name tplp -p 3001:3000 -e TEMPLAITOR_SECRET=ci-only-secret-0123456789abcdef0123456789 \
            -e TEMPLAITOR_PROJECT=/app -e TEMPLAITOR_API_KEYS=ci-project-key-0123456789abcdef templaitor:ci
          for _ in $(seq 30); do curl -fs http://127.0.0.1:3001/healthz && break; sleep 1; done
          curl -fs -H 'Authorization: Bearer ci-project-key-0123456789abcdef' http://127.0.0.1:3001/v1/templates | grep -q order-confirmation || { docker logs tplp; exit 1; }
          curl -fs -H 'Authorization: Bearer ci-project-key-0123456789abcdef' 'http://127.0.0.1:3001/v1/versions?template=orders/order-confirmation' | grep -q '"number":1' || { docker logs tplp; exit 1; }
          docker rm -f tplp
