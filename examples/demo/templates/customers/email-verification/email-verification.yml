subject:
  es: Acme | Valida tu email
  en: Acme | Verify your email

messages:
  es:
    title: Valida tu dirección de email
    greeting: "Hola {{ first_name }},"
    intro: >
      Gracias por registrarte en Acme. Haz click en el botón para validar
      tu dirección de email y activar tu cuenta.
    cta: Verificar email
    expiry: Este enlace expirará en 24 horas.
    ignore: Si no has creado una cuenta en Acme, puedes ignorar este email.

  en:
    title: Verify your email address
    greeting: "Hello {{ first_name }},"
    intro: >
      Thank you for signing up to Acme. Click the button below to verify
      your email address and activate your account.
    cta: Verify email
    expiry: This link will expire in 24 hours.
    ignore: If you didn't create an Acme account, you can safely ignore this email.
