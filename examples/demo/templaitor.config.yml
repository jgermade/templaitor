# Configuración del proyecto templaitor
name: Demo
templates: templates          # raíz de plantillas
outDir: dist                  # salida compilada (HTML/TXT con Jinja2)
layouts: _layouts             # relativo a `templates`
components: _components     # componentes reutilizables: $import(_components/nombre)
links: _shared/links.yml
static: _shared               # servido en /static/ por el editor

# idioma (clave en el .yml) → locale usado en los nombres de fichero y en $lang
locales:
  es: es-ES
  en: en-US

output:
  text: true                  # genera <nombre>.<locale>.txt
  subject: true               # genera <nombre>.<locale>.subject.txt

# PDF: motor de render (weasyprint · prince · chromium · auto). weasyprint y prince generan PDF/UA-1.
pdf:
  engine: auto

# SMTP para "Enviar prueba" desde el editor (Mailpit local: `make up` lo arranca con docker compose)
smtp:
  host: localhost
  port: 1025
  from: noreply@example.com
  label: mailpit              # texto del botón de envío
  web: /mailpit/              # bandeja web (relativa: funciona en local y a través de intergate)
